# P16b / C-SUP-02: keep dependencies + pinned actions/images fresh. Grouped minor/patch to limit PR noise for a
# ≤20-user on-prem system. NOTE: the docker ecosystem updates Dockerfile `FROM`s under deploy/ (best-effort for
# the `Dockerfile.<name>` naming); it does NOT track images in docker-compose.yml — those are maintained by hand.
version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      dotnet-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/src/Acmp.Web"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker"
    directory: "/deploy"
    schedule:
      interval: "weekly"
    # ADR-0047 d2 (amended by DEC-203): the SQL Server image stays on the 2022 line (the 2025 line
    # crashes at startup under concurrent boot — DEF-121/DEF-130, isolated by SL-039/SL-040). Tags from
    # 2023 on are not proposed; digest (CU) bumps within 2022-latest still are (ADR-0047 e4).
    # The name is the repository path WITHOUT the registry host: Dependabot names this image
    # `mssql/server`, and the earlier `mcr.microsoft.com/mssql/server` never matched (DEF-192).
    # Verify it in the Dependabot job log, not by a missing PR: closed PR #135 alone keeps a
    # 2025-latest PR away. The log must show this entry in `ignore-conditions` and must not say
    # "Latest version is 2025-latest".
    ignore:
      - dependency-name: "mssql/server"
        versions: [">= 2023"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
