name: SQL startup sampling

# WBS-32 / SL-039 (DEC-142) — the DEF-121 / DEF-130 sampling experiment. MANUAL ONLY: no push, no
# pull_request trigger, so it never changes what CI runs (SC-053). Dispatch one ARM at a time; the
# tally and every crash log are uploaded on every outcome.
#
# Arms (DEC-142 d1/d4/d5), all on ubuntu-latest because that is the runner the crash happens on:
#   fts-shipped       the shipped deploy/Dockerfile.sqlserver as-is. ⚠ Named by SOURCE, not line: it was
#                     the 2025 line until ADR-0046 (2026-09-07) and is the 2022 line since — the artefact
#                     name says which Dockerfile was built, and the job log's `FROM` line says which base.
#                     Before ADR-0046 this arm was the harness's positive control (LL-060: 4/120 backstop,
#                     8/120 heavy); since, it is the POST-SHIP FALSIFIER — any SQLPAL `Reason:` crash here
#                     is a NEW defect row by signature (ADR-0046 d5), never an append.
#   fts-2022-premove  the pre-move DOCKERFILE, byte-for-byte from git (0794dcaf^): 2022-latest@fc010e5c
#                     + the ubuntu/22.04 repo. ⚠ The Dockerfile is what ran 453 CI runs with no filed
#                     crash; the IMAGE is not — its base is digest-pinned, but `mssql-server-fts` pulls in
#                     whatever 2022 CU the repo serves on dispatch day (the Dockerfile's own comment says it
#                     drags mssql-server with it), exactly as it did on each of those 453 days. All three
#                     arms are built the same day, so the isolation BETWEEN arms is unaffected; reading a
#                     clean arm (ii) against the 453 is not a same-binary comparison and WBS-33 must say so.
#   stock-shipped-base  the shipped Dockerfile's base digest with NO FTS package — separates the base from
#                     the package. Same naming rule: it follows whatever `FROM` the shipped file carries.
#   (fts-2022-candidate — the ADR-0046 remedy as it would ship — was an arm while SL-040 proved it; the
#   candidate file became deploy/Dockerfile.sqlserver and the arm is now `fts-shipped`. To sample a FUTURE
#   candidate, e.g. a 2025 CU under ADR-0046 d4, put it in a branch as deploy/Dockerfile.sqlserver and
#   dispatch `fts-shipped` on that branch.)
on:
  workflow_dispatch:
    inputs:
      arm:
        description: which image to sample
        required: true
        type: choice
        options: [fts-shipped, fts-2022-premove, stock-shipped-base]
      starts:
        description: container starts (DEC-142 d3 sized 120; a faulty arm reads clean ~1.4% of the time there)
        required: true
        type: number
        default: 120
      contention:
        # Arm (i) alone on an idle runner gave 0/120 (run 34098382664). The CI job where it crashes boots
        # SqlBackstopFixture's 2022 container and MinIO concurrently with the FTS one. One variable at a
        # time (WBS-32): `backstop` starts the same 2022-CU14 image alongside EVERY subject start.
        description: sidecar containers booted at the same moment as each start
        required: true
        type: choice
        # `heavy` (WBS-36): two sidecars per start — the backstop AND a stock 2025 — the nearest cheap
        # approximation to CI's two SQL Servers plus MinIO plus a busy dotnet process, to try for DEF-121.
        # ⚠ The 2025 sidecar is KEPT after ADR-0046 on purpose: it is the contention under which the proof
        # was measured (8/120 vs 0/120), and a sidecar is a bystander, not the subject.
        options: [none, backstop, heavy]
        default: none

permissions:
  contents: read
  packages: read   # WBS-41.2: fts-shipped pulls the private pinned FTS test image

jobs:
  sample:
    runs-on: ubuntu-latest
    # 120 starts x <=40 s healthy = 80 min; the per-start bound is 300 s, so a run of timeouts is what
    # would push past this, and that is a finding in itself.
    timeout-minutes: 180
    steps:
      # fetch-depth 0: arm (ii) reads a Dockerfile out of history with `git show`, which a shallow clone
      # cannot serve ("bad object" would read like a harness bug). security.yml does the same for AC-126.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # fts-shipped runs scripts/check-fts-pin.mjs (WBS-41.2); pinned like the compose and e2e jobs.
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Self-check the classifier
        run: bash scripts/test-sql-startup-sample.sh

      - name: Prepare the arm's image
        id: image
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          case "${{ inputs.arm }}" in
            fts-shipped)
              grep -n '^FROM' deploy/Dockerfile.sqlserver   # which line was built, in the job log
              sha256sum deploy/Dockerfile.sqlserver
              # WBS-41.2 (DEC-182 f3): the shipped file pulls the pinned image; a branch CANDIDATE (a changed
              # Dockerfile, exit 1) is built, because building it is the point. Exit 2 is a broken pin: stop.
              if ref=$(node scripts/check-fts-pin.mjs); then
                echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
                timeout 15m docker pull "$ref"
              else
                rc=$?; [ "$rc" = 1 ] || exit "$rc"
                timeout 15m docker build -f deploy/Dockerfile.sqlserver -t acmp/sample:fts-shipped deploy
                ref=acmp/sample:fts-shipped
              fi
              echo "ref=$ref" >> "$GITHUB_OUTPUT" ;;
            fts-2022-premove)
              git show 0794dcaf^:deploy/Dockerfile.sqlserver > /tmp/Dockerfile.premove
              grep -n '^FROM' /tmp/Dockerfile.premove
              sha256sum /tmp/Dockerfile.premove   # provenance of what was built, in the job log
              # 15m: the pre-move Dockerfile still fetches jammy/universe, DEF-140's stall shape on noble.
              timeout 15m docker build -f /tmp/Dockerfile.premove -t acmp/sample:fts-2022-premove deploy
              echo "ref=acmp/sample:fts-2022-premove" >> "$GITHUB_OUTPUT" ;;
            stock-shipped-base)
              ref=$(sed -n 's/^FROM \(mcr\.microsoft\.com\/mssql\/server:[^ ]*\).*/\1/p' deploy/Dockerfile.sqlserver)
              docker pull "$ref"
              echo "ref=$ref" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Sample ${{ inputs.starts }} starts (contention ${{ inputs.contention }})
        env:
          # tests/Acmp.Integration.Tests/SqlBackstopFixture.cs:29 - the exact image CI boots alongside.
          SIDECARS: ${{ inputs.contention == 'backstop' && 'mcr.microsoft.com/mssql/server:2022-CU14-ubuntu-22.04' || inputs.contention == 'heavy' && 'mcr.microsoft.com/mssql/server:2022-CU14-ubuntu-22.04 mcr.microsoft.com/mssql/server:2025-latest@sha256:4bab24f36c1ecd48e85f7d37df26e6bf301641d84c3fe652f9a0dcc947d512e1' || '' }}
        run: |
          for s in $SIDECARS; do docker pull "$s"; done
          bash scripts/sql-startup-sample.sh "${{ steps.image.outputs.ref }}" "${{ inputs.starts }}" sampling-out

      - name: Summary
        if: always()
        run: |
          {
            echo "## ${{ inputs.arm }} — \`${{ steps.image.outputs.ref }}\`"
            echo "contention: ${{ inputs.contention }}"
            echo '```json'; cat sampling-out/tally.json 2>/dev/null || echo '(no tally written)'; echo '```'
            echo; echo '### Reason codes among crashes'
            grep -ho 'Reason: 0x[0-9A-Fa-f]*' sampling-out/start-*.log 2>/dev/null | sort | uniq -c || echo '(none)'
          } >> "$GITHUB_STEP_SUMMARY"

      # Uploaded on EVERY outcome (WBS-29's lesson: `if: failure()` skips exactly the run that carries the signal).
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sampling-${{ inputs.arm }}-${{ inputs.contention }}-${{ github.run_id }}
          path: sampling-out
          if-no-files-found: warn
          retention-days: 30
